version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: amis-postgres
    environment:
      POSTGRES_DB: amisdb
      POSTGRES_USER: amis
      POSTGRES_PASSWORD: amis123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amis -d amisdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amis-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/amisdb
      SPRING_DATASOURCE_USERNAME: amis
      SPRING_DATASOURCE_PASSWORD: amis123
      JWT_SECRET: amis-secret-key-1234567890-abcdefghijklmnop
    ports:
      - "8080:8080"

volumes:
  postgres_data:
