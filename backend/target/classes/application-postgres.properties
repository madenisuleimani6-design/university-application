spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/amisdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:amis}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:amis123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql
server.port=8080
